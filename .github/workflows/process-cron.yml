name: Process AM links

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: process-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger /api/process
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 300 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://motion-preset67.vercel.app/api/process"
